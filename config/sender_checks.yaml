# Sender checks (services/common/senders.py): spotting mail that claims to be
# from a business it isn't from. Used by the morning digest and chat.
#
# Brands that phishing commonly imitates, with the domains their mail really
# comes from (subdomains count: alerts.chase.com is chase.com). Mail whose
# display name is one of these brands (alone or with words like "Support" or
# "Security") from any other domain is marked as possible phishing. Add the
# businesses you deal with.
brands:
  paypal: [paypal.com]
  venmo: [venmo.com]
  zelle: [zellepay.com]
  amazon: [amazon.com, amazon.co.uk, amazonses.com, amazonaws.com, aws.com, primevideo.com]
  apple: [apple.com, icloud.com, itunes.com]
  icloud: [apple.com, icloud.com]
  microsoft: [microsoft.com, microsoftonline.com, office.com, outlook.com, live.com, xbox.com]
  outlook: [microsoft.com, outlook.com, live.com]
  office 365: [microsoft.com, microsoftonline.com, office.com]
  google: [google.com, youtube.com, gmail.com, googlegroups.com, googleusercontent.com, googlemail.com]
  gmail: [google.com, gmail.com]
  netflix: [netflix.com]
  facebook: [facebook.com, facebookmail.com, meta.com]
  meta: [meta.com, facebookmail.com]
  instagram: [instagram.com, mail.instagram.com, facebookmail.com]
  linkedin: [linkedin.com]
  dropbox: [dropbox.com, dropboxmail.com]
