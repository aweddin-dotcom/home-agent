# Names of the project's secrets. Values are never stored here: they live in
# the OS credential store (Windows Credential Manager on the laptop, the
# macOS Keychain on the Mac). See docs/secrets.md.
#
# To add a secret: add it here, then run
#   python scripts/secrets_cli.py set NAME

secrets:
  google_client:
    description: Google OAuth client JSON (client ID and secret)
  microsoft_client_id:
    description: Microsoft app (client) ID for Outlook/Hotmail sign-in
  icloud_apple_id:
    description: Apple ID (email) for iCloud calendar sign-in
  icloud_app_password:
    description: iCloud app-specific password (calendar sync; read-only in code only)
  notify_token:
    description: Push notification service token
  approval_signing_key:
    description: Signs one-time approvals for confirmed actions
