# Ollama is not in this file. It runs natively on the host (Windows or macOS)
# so it can use the GPU; Docker on macOS has no access to the Apple GPU.
# Containers reach it at host.docker.internal:11434.
#
# All ports bind to 127.0.0.1 so nothing is reachable from the network.
# Remote access goes through Tailscale (see docs/network.md).

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - ./data/vector_db:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      - QDRANT__TELEMETRY_DISABLED=true

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    restart: unless-stopped
    volumes:
      - ./data/open-webui:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # The assistant, offered as the "home-agent" model. Open WebUI only
      # reads these on its first start; otherwise add the connection in
      # Admin Panel > Settings > Connections (see README).
      - OPENAI_API_BASE_URL=http://agent-api:8000/v1
      - OPENAI_API_KEY=not-needed
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-api

  # The assistant's chat API (OpenAI-compatible), used by Open WebUI.
  # Reads the synced mail and calendar (read-only) and the email index;
  # holds no credentials at all.
  agent-api:
    build: ./services
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - HOME_AGENT_DB=/db/structured.db
    volumes:
      - ./config:/config:ro
      - db:/db:ro
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  # Syncs every enabled account on a schedule (config/retrieval_settings.yaml).
  # The only service that reaches Google, Microsoft, or Apple. Gets the
  # approvals folder (tokens are refreshed there) and only the secrets it
  # uses; the Google and Microsoft app credentials live inside each approval.
  sync-worker:
    build: ./services
    command: ["python", "-m", "services.ingestion.scheduler"]
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - HOME_AGENT_DB=/db/structured.db
      - HOME_AGENT_TOKENS=/tokens
      # Copied into the volume on first start, so nothing is re-downloaded.
      - HOME_AGENT_SEED_DB=/seed/structured.db
    volumes:
      - ./config:/config:ro
      - db:/db
      - ./data/tokens:/tokens
      - ./data/structured.db:/seed/structured.db:ro
    secrets:
      - icloud_apple_id
      - icloud_app_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

# The synced mail and calendar database. A Docker volume rather than a
# folder on the host: SQLite needs file locking that works reliably between
# containers, which host folder sharing (especially on Windows) doesn't give.
# It's a copy of what's at the providers, so it needs no backup.
volumes:
  db:

# Written by `python scripts/secrets_cli.py export` (run by scripts/up.py)
# from the OS credential store.
secrets:
  icloud_apple_id:
    file: ./secrets/icloud_apple_id
  icloud_app_password:
    file: ./secrets/icloud_app_password
